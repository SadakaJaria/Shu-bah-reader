<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no"/>
<meta name="theme-color" content="#f3ede0" media="(prefers-color-scheme: light)"/>
<meta name="theme-color" content="#0a1712" media="(prefers-color-scheme: dark)"/>
<title>مصحف شعبة</title>
<style>
/* ══════════ الخطوط: محلّية بالكامل — يعمل التطبيق دون إنترنت ══════════
   Scheherazade New (SIL, رخصة OFL) لا Amiri Quran: الأخير لا يغطّي U+065E
   وهو يرد ١٨٠٧ مرّات في هذا النصّ، فكان يخرج مربّعات فارغة مكان العلامة. */
@font-face{font-family:"Lateef";font-style:normal;font-weight:400;
  font-display:swap;src:url(fonts/lateef-arabic-400.woff2) format("woff2")}
@font-face{font-family:"Scheherazade New";font-style:normal;font-weight:400;
  font-display:swap;src:url(fonts/scheherazade-new-arabic-400.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Sans Arabic";font-style:normal;font-weight:400;
  font-display:swap;src:url(fonts/ibm-plex-sans-arabic-400.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Sans Arabic";font-style:normal;font-weight:700;
  font-display:swap;src:url(fonts/ibm-plex-sans-arabic-700.woff2) format("woff2")}

/* ══════════ هوية «صدقة جارية» ══════════ */
:root{
  --mushaf-bg:#f7f2e6; --mushaf-ink:#181410; --mushaf-shade:rgba(120,95,30,.05);
  --bar:#f3ede0; --bar-ink:#3a3120; --bar-line:rgba(169,130,46,.35);
  --gold:#c9a24b; --gold-strong:#8a6224;
  --font-ui:"IBM Plex Sans Arabic",system-ui,sans-serif;
  /* Lateef مضغوط أفقياً: سطر المصحف يخرج ١٤٫٧em بدل ٢٣٫٢، فيتّسع الخطّ
     أكبر بنحو ٥٧٪ في الصفحة الكاملة نفسها */
  --font-quran:"Lateef","Scheherazade New","Noto Naskh Arabic","Geeza Pro",serif;
}
@media (prefers-color-scheme:dark){
  :root{
    --mushaf-bg:#0f1a15; --mushaf-ink:#e6dcc0; --mushaf-shade:rgba(217,181,88,.05);
    --bar:#0a1712; --bar-ink:#f0e4bf; --bar-line:rgba(217,181,88,.3);
    --gold:#d9b558; --gold-strong:#e3c87b;
  }
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{font-family:var(--font-ui);-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}

#reader{position:fixed;inset:0;display:flex;flex-direction:column;
  background:radial-gradient(130% 90% at 50% 42%,var(--mushaf-shade),transparent 70%),var(--mushaf-bg)}

/* ── الشريط العلوي: اسم السورة ── */
#top{flex:0 0 auto;z-index:10;
  padding:calc(env(safe-area-inset-top) + 6px) 14px 6px;
  background:var(--bar);border-bottom:1px solid var(--bar-line);
  box-shadow:0 6px 18px rgba(0,0,0,.12);
  text-align:center;font-size:15px;font-weight:700;color:var(--gold-strong)}

/* ── الصفحة: خمسة عشر سطراً ── */
#page{flex:1 1 auto;min-height:0;position:relative;
  display:flex;flex-direction:column;justify-content:center;
  padding:5px 10px;
  font-family:var(--font-quran);color:var(--mushaf-ink);
  font-kerning:none;-webkit-font-smoothing:antialiased;
  opacity:1;transition:opacity .18s;
  -webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
#page.loading{opacity:0}
#page.scroll-mode{justify-content:flex-start;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
/* نمط التدفّق: نصّ متّصل بأكبر خطّ ممكن، والتمرير عمودي */
#page.flow{display:block;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
  text-align:justify;text-align-last:center;line-height:2.05}
#page.flow .m-line{display:block;white-space:normal}
#page.flow .head-box{font-size:.52em}

/* السطر يُمطّ من الحافة إلى الحافة — كما في المصحف */
.m-line{display:flex;justify-content:space-between;align-items:center;
  width:100%;white-space:nowrap;line-height:1;flex:0 0 auto;
  gap:.14em}   /* أدنى فاصل بين الكلمات: بدونه تتلاصق في السطر الممتلئ */
.m-line.center{justify-content:center}
.m-w{display:inline-block}

/* عنوان السورة والبسملة */
.m-line.head{justify-content:center}
.head-box{display:inline-block;padding:.16em 1.1em;
  border:1.5px solid var(--bar-line);border-radius:.5em;
  color:var(--gold-strong);font-family:var(--font-ui);
  font-size:.5em;font-weight:700;line-height:1.9}
.basmala{color:var(--gold-strong);font-size:.86em}

/* رقم الآية */
.num{display:inline-block;min-width:1.5em;height:1.5em;line-height:1.5em;
  margin:0 .1em;border:1.5px solid var(--gold);border-radius:50%;
  color:var(--gold-strong);font-family:var(--font-ui);font-size:.4em;font-weight:700;
  text-align:center;vertical-align:middle}

/* ── الشريط السفلي: سهمان ورقم الصفحة ── */
#bot{flex:0 0 auto;z-index:10;display:flex;align-items:center;gap:12px;
  padding:7px 12px calc(env(safe-area-inset-bottom) + 7px);
  background:var(--bar);border-top:1px solid var(--bar-line);
  box-shadow:0 -6px 18px rgba(0,0,0,.12)}
#bot button{flex:1;height:58px;min-width:0;
  display:flex;align-items:center;justify-content:center;
  border:1.5px solid var(--bar-line);border-radius:18px;
  background:transparent;color:var(--gold-strong);cursor:pointer;
  transition:transform .12s,opacity .2s}
#bot button:active{transform:scale(.96)}
#bot button:disabled{opacity:.28;cursor:default}
#bot button svg{width:32px;height:32px;fill:none;stroke:currentColor;
  stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#pageNum{flex:0 0 auto;min-width:92px;text-align:center;
  font-size:23px;font-weight:700;color:var(--bar-ink);line-height:1.2}
#pageNum small{display:block;font-size:11.5px;font-weight:400;opacity:.62;margin-top:2px}

#msg{position:fixed;inset:0;display:none;align-items:center;justify-content:center;
  padding:32px;text-align:center;font-size:19px;line-height:1.9;
  color:var(--mushaf-ink);background:var(--mushaf-bg);z-index:50}
#msg.show{display:flex}
</style>
</head>
<body>

<div id="reader">
  <div id="top"></div>
  <div id="page"></div>
  <div id="bot">
    <!-- في RTL يُرسم أوّلُ عنصرٍ يميناً: السابق يميناً والتالي يساراً،
         وهو اتجاه تقليب المصحف -->
    <button id="prev" aria-label="الصفحة السابقة">
      <svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>
    </button>
    <div id="pageNum"></div>
    <button id="next" aria-label="الصفحة التالية">
      <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
  </div>
</div>
<div id="msg" class="show">جارِ فتح المصحف…</div>

<script>
'use strict';

const CFG = {
  // 'block'  = إطار واحد لكل الصفحات: مقاس خطّ ثابت وكل سطر يملأ العرض.
  //            حدود الصفحات مطابقة للمصحف، ومواضع قطع الأسطر داخلها لا.
  // 'mushaf' = أسطر مصحف المدينة كما هي (مطابقة تامّة، مقاس متغيّر ١٥→٤١)
  // 'flow'   = نصّ متدفّق بخطّ كبير مع تمرير
  LAYOUT    : 'block',
  // سعة السطر بوحدة em عند المقاس الثابت. قيست على الصفحات الـ٦٠٤:
  // عند ١٧ لا تتجاوز صفحةٌ واحدة خمسة عشر سطراً، فيثبت التباعد أيضاً.
  // (١٥٫٨ تعطي خطّاً أكبر لكن ثماني صفحات تخرج بستّة عشر سطراً.)
  LINE_EM   : 17.0,
  LINES     : 15,          // أسطر صفحة المصحف — التباعد يُقسم عليها دائماً
  DATA      : 'quran-shubah.json',
  STORE_KEY : 'shubah:lastPage',
  REF       : 44           // حجم مرجعي للقياس
};

const BASMALA = 'بِسۡمِ ٱللَّهِ ٱلرَّحۡمَٰنِ ٱلرَّحِيمِ';

const $ = id => document.getElementById(id);
const topEl = $('top'), pageEl = $('page'), numEl = $('pageNum'),
      msgEl = $('msg'), nextBtn = $('next'), prevBtn = $('prev');

const arNum = n => String(n).replace(/[0-9]/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);

let SURAS = {}, PAGES = new Map(), TOTAL = 604, current = 0;
let currentRows = [];   // صفوف الصفحة المعروضة مع عرض كل صفّ عند الحجم المرجعي

/* ══════════ تحميل المصحف مرّة واحدة ══════════ */
async function loadQuran(){
  const r = await fetch(CFG.DATA);
  if(!r.ok) throw new Error('data');
  const d = await r.json();
  SURAS = d.suras;
  // v = [[سورة, آية, صفحة, أوّل سطر, آخر سطر, نصّ], …]
  d.v.forEach(row => {
    const a = { sura:row[0], aya:row[1], page:row[2], ls:row[3], le:row[4], text:row[5] };
    if(!PAGES.has(a.page)) PAGES.set(a.page, []);
    PAGES.get(a.page).push(a);
  });
  TOTAL = Math.max(...PAGES.keys());
}

/* ══════════ توزيع الآيات على أسطر الصفحة ══════════
   البيانات تعطي لكل آية أوّل سطر وآخر سطر في مصحف المدينة، فنلتزم بهما:
   لا نبدأ آية قبل سطرها، ونُنهي الآية كاملةً في سطرها الأخير. أمّا موضع
   القطع داخل آية تمتدّ على أسطر فيُحسب بقياس عرض الكلمات. */
function composeLines(ayat, ctx){
  const maxLine = ayat.reduce((m,a) => Math.max(m, a.le), 1);

  // الأسطر التي لا تشغلها آية = عنوان سورة (+ بسملة)
  const covered = new Set();
  ayat.forEach(a => { for(let L=a.ls; L<=a.le; L++) covered.add(L); });
  const special = new Map();
  ayat.filter(a => a.aya === 1).forEach(a => {
    const free = [];
    for(let L=a.ls-1; L>=1 && !covered.has(L); L--) free.unshift(L);
    if(free.length >= 2){
      special.set(free[free.length-2], {t:'head', s:a.sura});
      special.set(free[free.length-1], {t:'bas'});
    }else if(free.length === 1){
      special.set(free[0], {t:'head', s:a.sura});
    }
  });

  // طابور الرموز: كل كلمة، ثمّ رقم الآية في آخرها
  const queue = [];
  ayat.forEach(a => {
    a.text.split(/\s+/).filter(Boolean).forEach(w => queue.push({txt:w, a:a}));
    queue.push({num:a.aya, a:a});
  });
  // كم رمزاً بقي لكل آية
  const left = new Map();
  queue.forEach(t => left.set(t.a, (left.get(t.a) || 0) + 1));

  const width = t => t.num !== undefined ? CFG.REF * 0.62 : ctx.measureText(t.txt).width;
  const SPACE = ctx.measureText(' ').width;

  // سعة السطر تُشتقّ من محتوى الصفحة نفسها، لا من تقدير خارجي:
  // مجموع عرض الرموز موزّعاً على عدد أسطر النصّ. هكذا يستقيم التوزيع
  // مهما كان عرض الشاشة، فالحجم النهائي يضبطه autofit بعدُ.
  const textLines = covered.size || 1;
  let total = 0;
  queue.forEach((t, i) => { total += width(t) + (i ? SPACE : 0); });
  const cap = total / textLines;

  const out = [];
  for(let L=1; L<=maxLine; L++){
    if(special.has(L)){ out.push({special:special.get(L)}); continue; }
    if(!covered.has(L)){ out.push({items:[]}); continue; }

    const items = [];
    let w = 0;
    while(queue.length){
      const t = queue[0];
      if(t.a.ls > L) break;                       // آيةٌ سطرُها لاحق
      const mustEnd = (t.a.le === L);             // الآية تنتهي في هذا السطر
      if(!mustEnd){
        // اترك رمزاً واحداً على الأقلّ لكلّ سطر باقٍ من هذه الآية
        if(left.get(t.a) <= t.a.le - L) break;
      }
      const tw = width(t) + (items.length ? SPACE : 0);
      // الآية المنتهية في هذا السطر تُؤخذ كاملةً ولو فاض (يُضغط أفقياً لاحقاً).
      // بلا هذا الاستثناء تسقط آيةٌ تنتهي مع أختها في السطر الأخير.
      if(!mustEnd && items.length && w + tw > cap) break;
      items.push(queue.shift());
      left.set(t.a, left.get(t.a) - 1);
      w += tw;
    }
    out.push({items:items, w:items.reduce((a,t) => a + width(t), 0)});
  }

  // شبكة أمان: لا يجوز أن تسقط كلمة من المصحف مهما اختلّ الحساب
  if(queue.length){
    for(let i=out.length-1; i>=0; i--){
      if(out[i].items){
        const rest = queue.splice(0);
        out[i].items.push(...rest);
        out[i].w += rest.reduce((a,t) => a + width(t), 0);
        break;
      }
    }
  }
  return out;
}

/* ══════════ بناء الصفحة ══════════ */
// نمط الإطار الواحد: تُقطع الأسطر لتملأ سعةً ثابتة (LINE_EM)، فيخرج مقاس
// الخطّ نفسه في كل صفحات المصحف. الصفحة تبقى صفحة المصحف، والقطع داخلها لنا.
function composeBlock(ayat, ctx){
  const REF = CFG.REF, GAP = 0.14, cap = CFG.LINE_EM;
  const rows = [];
  let items = [], sum = 0;
  const flush = () => { if(items.length){ rows.push({items:items, w:sum}); items=[]; sum=0; } };

  ayat.forEach(a => {
    if(a.aya === 1){
      flush();
      rows.push({special:{t:'head', s:a.sura}});
      if(a.sura !== 1 && a.sura !== 9) rows.push({special:{t:'bas'}});
    }
    const toks = a.text.split(/\s+/).filter(Boolean).map(t => ({txt:t, a:a}));
    toks.push({num:a.aya, a:a});
    toks.forEach(t => {
      const tw = (t.num !== undefined) ? REF * 0.62 : ctx.measureText(t.txt).width;
      // العرض بوحدة em لو أضفنا هذا الرمز: المجموع زائد فاصلاً لكل ما سبقه
      const need = (sum + tw) / REF + GAP * items.length;
      if(items.length && need > cap) flush();
      items.push(t);
      sum += tw;
    });
  });
  flush();
  return rows;
}

// نمط التدفّق: نفس آيات الصفحة وعنوانها وبسملتها، بلا التزام بمواضع الأسطر
function buildFlow(ayat){
  const frag = document.createDocumentFragment();
  ayat.forEach(a => {
    if(a.aya === 1){
      const h = document.createElement('div');
      h.className = 'm-line head';
      const b = document.createElement('span');
      b.className = 'head-box';
      b.textContent = 'سورة ' + (SURAS[a.sura] || '');
      h.appendChild(b);
      frag.appendChild(h);
      if(a.sura !== 1 && a.sura !== 9){
        const bs = document.createElement('div');
        bs.className = 'm-line head';
        const x = document.createElement('span');
        x.className = 'basmala';
        x.textContent = BASMALA;
        bs.appendChild(x);
        frag.appendChild(bs);
      }
    }
    frag.appendChild(document.createTextNode(a.text + ' '));
    const n = document.createElement('span');
    n.className = 'num';
    n.textContent = arNum(a.aya);
    frag.appendChild(n);
    frag.appendChild(document.createTextNode(' '));
  });
  pageEl.innerHTML = '';
  pageEl.appendChild(frag);
}

function buildPage(p){
  const ayat = PAGES.get(p) || [];
  if(CFG.LAYOUT === 'flow'){
    currentRows = [];
    buildFlow(ayat);
    const names = [...new Set(ayat.map(a => SURAS[a.sura]))];
    topEl.textContent = names.length ? 'سورة ' + names.join(' · ') : '';
    return;
  }

  const ctx = buildPage._ctx || (buildPage._ctx = document.createElement('canvas').getContext('2d'));
  ctx.font = CFG.REF + "px " + getComputedStyle(pageEl).fontFamily;
  // القياس بالحجم المرجعي: النِّسَب وحدها تهمّ، وautofit يضبط الحجم النهائي
  const rows = (CFG.LAYOUT === 'block') ? composeBlock(ayat, ctx) : composeLines(ayat, ctx);
  currentRows = rows;

  const frag = document.createDocumentFragment();
  rows.forEach(row => {
    const el = document.createElement('div');
    el.className = 'm-line';
    if(row.special){
      el.classList.add('head');
      if(row.special.t === 'head'){
        const b = document.createElement('span');
        b.className = 'head-box';
        b.textContent = 'سورة ' + (SURAS[row.special.s] || '');
        el.appendChild(b);
      }else{
        const b = document.createElement('span');
        b.className = 'basmala';
        b.textContent = BASMALA;
        el.appendChild(b);
      }
    }else{
      if(row.items.length < 2) el.classList.add('center');
      row.items.forEach(t => {
        const s = document.createElement('span');
        if(t.num !== undefined){ s.className = 'num'; s.textContent = arNum(t.num); }
        else { s.className = 'm-w'; s.textContent = t.txt; }
        el.appendChild(s);
      });
    }
    frag.appendChild(el);
  });

  pageEl.innerHTML = '';
  pageEl.appendChild(frag);

  const names = [...new Set(ayat.map(a => SURAS[a.sura]))];
  topEl.textContent = names.length ? 'سورة ' + names.join(' · ') : '';
}

/* ══════════ أكبر خطّ يتّسع في الصفحة ══════════ */
function autofit(){
  const pcs = getComputedStyle(pageEl);
  const avail = pageEl.clientWidth - parseFloat(pcs.paddingRight) - parseFloat(pcs.paddingLeft);
  if(avail <= 0) return;

  if(CFG.LAYOUT === 'flow'){
    // بحث ثنائي عن أكبر حجم يتّسع في الشاشة، بحدّ أدنى مريح للقراءة؛
    // ما لم يتّسع عنده يُمرَّر عمودياً بدل أن يصغُر الخطّ
    const MIN = 27, MAX = 46;
    let lo = MIN, hi = MAX, best = MIN;
    pageEl.style.fontSize = MAX + 'px';
    if(pageEl.scrollHeight <= pageEl.clientHeight) best = MAX;
    else{
      while(lo <= hi){
        const mid = Math.floor((lo + hi) / 2);
        pageEl.style.fontSize = mid + 'px';
        if(pageEl.scrollHeight <= pageEl.clientHeight){ best = mid; lo = mid + 1; }
        else hi = mid - 1;
      }
    }
    pageEl.style.fontSize = best + 'px';
    pageEl.scrollTop = 0;
    return;
  }

  const REF = CFG.REF;
  pageEl.style.fontSize = REF + 'px';

  const lines = [...pageEl.querySelectorAll('.m-line')];
  if(!lines.length) return;

  if(CFG.LAYOUT === 'block'){
    // المقاس مشتقّ من سعة السطر الثابتة وحدها، فهو واحدٌ في كل صفحة
    const usableH0 = pageEl.clientHeight - parseFloat(pcs.paddingTop) - parseFloat(pcs.paddingBottom);
    let size = Math.max(12, avail / CFG.LINE_EM * 0.985);
    // التباعد يُقسم على خمسة عشر دائماً لا على أسطر هذه الصفحة، فيخرج
    // إيقاع الصفحات واحداً. والصفحة الأقصر تُتوسَّط رأسياً (justify-content).
    const slot0 = usableH0 / Math.max(CFG.LINES, lines.length);
    // صمّام: لو خرجت صفحة بأسطر أكثر من المتوقّع لا ندع السطور تتداخل
    if(size * 1.62 > slot0) size = slot0 / 1.62;
    pageEl.style.fontSize = size + 'px';
    // السطر القصير (آخر سطر في الصفحة أو ما قبل عنوان سورة) لا يُمطّ:
    // مطّ خمس كلمات على عرض الصفحة يترك فجواتٍ تُشتّت العين.
    const GAP0 = 0.14;
    lines.forEach((l, i) => {
      l.style.height = slot0 + 'px';
      l.style.transform = '';
      const row = currentRows[i];
      if(!row || !row.items){ l.classList.remove('center'); return; }
      const w = row.w * size / REF + GAP0 * size * Math.max(0, row.items.length - 1);
      l.classList.toggle('center', w < avail * 0.8);
    });
    return;
  }

  // العرض المرسوم لكل سطر مقيسٌ عند بناء الصفحة (canvas)، لا من الـDOM:
  // scrollWidth لا يحسب الفيض عند حافة البدء في اتجاه RTL، فكان القياس
  // ناقصاً والحجم أكبر ممّا يتّسع، فتُقصّ أوّل كلمة من السطر.
  const GAP = 0.14;   // الفاصل بين الكلمات بوحدة em (نفس قيمة gap في CSS)
  const nat = lines.map((l,i) => (currentRows[i] && currentRows[i].w) || 0);
  const gaps = lines.map((l,i) => Math.max(0, ((currentRows[i] && currentRows[i].items) || []).length - 1));
  // أوسع سطر: العرض دالّةٌ في الحجم = w·(size/REF) + GAP·size·(عدد الفواصل)
  const need = nat.map((w,i) => w / REF + GAP * gaps[i]);
  const maxNeed = Math.max(...need, 0.001);

  const usableH = pageEl.clientHeight - parseFloat(pcs.paddingTop) - parseFloat(pcs.paddingBottom);
  // نقسم الارتفاع على أسطر الصفحة الفعلية لا على ١٥ دائماً: صفحتا الفاتحة
  // والبقرة الأوليان أقلّ أسطراً، فتخرجان بخطّ كبير كما في مصحف المدينة
  const slot = usableH / lines.length;
  const sizeW = Math.max(12, avail / maxNeed * 0.985);      // هامش أمان ١٫٥٪

  // الحدّ الذي يفرضه الارتفاع: نقيس أعلى «حبر» مرسوم فعلياً في أي سطر
  // (بما فيه الحركات وعلامات الوقف) بدل ثابتٍ مقدّر، فيتبع الحجمُ الخطَّ
  // المستعمل مهما كان بدل أن نترك فراغاً لا داعي له.
  let maxInk = 0;
  try{
    const ictx = autofit._ctx || (autofit._ctx = document.createElement('canvas').getContext('2d'));
    ictx.font = REF + 'px ' + getComputedStyle(pageEl).fontFamily;
    lines.forEach(l => {
      if(l.classList.contains('head')) return;
      const m = ictx.measureText(l.textContent);
      const ink = (m.actualBoundingBoxAscent || 0) + (m.actualBoundingBoxDescent || 0);
      if(ink > maxInk) maxInk = ink;
    });
  }catch(_){}
  const sizeH = maxInk > 0 ? REF * (slot * 1.02) / maxInk : slot / 1.62;

  // شاشة قصيرة أو أفقية: أكبر خط ممكن + تمرير عمودي (أوضح لكبار السن)
  const shortH = (window.matchMedia && window.matchMedia('(orientation: landscape)').matches)
                 || pageEl.clientHeight < pageEl.clientWidth * 0.9;
  const size = (shortH && sizeH < sizeW - 1)
    ? Math.min(56, sizeW)
    : Math.max(12, Math.min(sizeW, sizeH));

  pageEl.classList.toggle('scroll-mode', shortH && sizeH < sizeW - 1);
  pageEl.style.fontSize = size + 'px';
  if(pageEl.classList.contains('scroll-mode')) pageEl.scrollTop = 0;

  lines.forEach((l,i) => {
    l.style.height = (pageEl.classList.contains('scroll-mode') ? size * 1.9 : slot) + 'px';
    if(l.classList.contains('head')) return;
    const w = nat[i] * size / REF + GAP * size * gaps[i];
    l.style.transform = '';
    if(w > avail + 1){
      // سطر فائض: يُضغط أفقياً بدل أن يُقصّ
      l.style.transformOrigin = 'right center';
      l.style.transform = 'scaleX(' + (avail / w).toFixed(4) + ')';
      l.classList.remove('center');
    }else{
      // السطر القصير يُتوسَّط بدل أن يُمطّ بفجوات (كأسطر الفاتحة)
      l.classList.toggle('center', w < avail * 0.78);
    }
  });
}

/* ══════════ العرض ══════════ */
function render(p){
  pageEl.classList.add('loading');
  current = p;
  numEl.innerHTML = arNum(p) + '<small>من ' + arNum(TOTAL) + '</small>';
  nextBtn.disabled = p >= TOTAL;
  prevBtn.disabled = p <= 1;
  try{ localStorage.setItem(CFG.STORE_KEY, String(p)); }catch(_){}

  const draw = () => {
    pageEl.classList.toggle('flow', CFG.LAYOUT === 'flow');
    buildPage(p);
    autofit();
    pageEl.classList.remove('loading');
  };
  // ننتظر جاهزية الخطّ قبل القياس وإلّا قِسنا خطّاً بديلاً بمقاسات مختلفة.
  // صمّام أمان ٣ ثوانٍ: فشل الخطّ لا يترك الصفحة بيضاء.
  if(document.fonts && document.fonts.ready){
    Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 3000))])
      .then(draw).catch(draw);
  }else draw();
}

/* ══════════ التنقّل ══════════ */
function goto(n){
  const p = Math.max(1, Math.min(TOTAL, n));
  if(p !== current) render(p);
}
const nextPage = () => goto(current + 1);
const prevPage = () => goto(current - 1);

nextBtn.addEventListener('click', nextPage);
prevBtn.addEventListener('click', prevPage);

let sx = 0, sy = 0, tracking = false;
pageEl.addEventListener('touchstart', e => {
  const c = e.changedTouches[0];
  sx = c.clientX; sy = c.clientY; tracking = true;
}, {passive:true});
pageEl.addEventListener('touchend', e => {
  if(!tracking) return;
  tracking = false;
  const c = e.changedTouches[0];
  const dx = c.clientX - sx, dy = c.clientY - sy;
  if(Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 60){
    if(dx > 0) nextPage(); else prevPage();   // اتجاه تقليب المصحف
  }
});

document.addEventListener('keydown', e => {
  if(e.key === 'ArrowLeft') nextPage();
  else if(e.key === 'ArrowRight') prevPage();
});

// دوران الشاشة أو تغيّر أبعادها: أعِد بناء الصفحة (توزيع الأسطر يعتمد العرض)
let refitTimer = null;
function refit(){
  clearTimeout(refitTimer);
  refitTimer = setTimeout(() => { if(current) autofit(); }, 160);
}
window.addEventListener('resize', refit);
window.addEventListener('orientationchange', refit);
if(window.visualViewport) window.visualViewport.addEventListener('resize', refit);

/* ══════════ البداية ══════════ */
// نُجبر تحميل خطوط الصفحة قبل أوّل قياس. document.fonts.ready وحده لا يكفي:
// إن لم يكن الخطّ قد بدأ التحميل يُحلّ فوراً، فيقاس عرض السطر بمقاييس خطّ
// بديل ويخرج الحجم خاطئاً في أوّل صفحة تُفتح.
async function preloadFonts(){
  if(!document.fonts || !document.fonts.load) return;
  const fam = getComputedStyle(pageEl).fontFamily.split(',')[0].trim().replace(/^["']|["']$/g,'');
  const jobs = [
    document.fonts.load('44px "' + fam + '"', 'بِسۡمِ ٱللَّهِ'),
    document.fonts.load('700 16px "IBM Plex Sans Arabic"', 'سورة ٠١٢')
  ];
  try{
    await Promise.race([
      Promise.allSettled(jobs),
      new Promise(r => setTimeout(r, 4000))   // صمّام أمان: لا ننتظر إلى الأبد
    ]);
  }catch(_){}
}

(async function start(){
  try{
    await loadQuran();
  }catch(_){
    msgEl.textContent = 'تعذّر فتح المصحف — تحقّق من الاتصال';
    return;
  }
  // ?page=٢٥٥ يفتح صفحة بعينها (للفحص والروابط)، وإلّا فآخر صفحة محفوظة
  let p = parseInt(new URLSearchParams(location.search).get('page')) || 0;
  if(!p){ try{ p = parseInt(localStorage.getItem(CFG.STORE_KEY)) || 1; }catch(_){ p = 1; } }
  await preloadFonts();
  msgEl.classList.remove('show');
  render(Math.max(1, Math.min(TOTAL, p)));
})();
</script>
