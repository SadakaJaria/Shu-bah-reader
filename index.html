<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"/>
<!-- التكبير بالإصبعين مسموح: الصفحة رسمٌ متجه يبقى حادّاً مهما كبر،
     والسحب بإصبع واحد لا يتأثّر فيبقى التقليب سليماً -->
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=5,user-scalable=yes"/>
<meta name="theme-color" content="#f3ede0" media="(prefers-color-scheme: light)"/>
<meta name="theme-color" content="#0a1712" media="(prefers-color-scheme: dark)"/>
<title>مصحف شعبة</title>
<link rel="manifest" href="manifest.json"/>
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png"/>
<link rel="icon" href="icons/icon-192.png"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="مصحف شعبة"/>
<style>
/* ══════════ الخطوط: محلّية بالكامل — يعمل التطبيق دون إنترنت ══════════
   Scheherazade New (SIL, رخصة OFL) لا Amiri Quran: الأخير لا يغطّي U+065E
   وهو يرد ١٨٠٧ مرّات في هذا النصّ، فكان يخرج مربّعات فارغة مكان العلامة. */
@font-face{font-family:"Lateef";font-style:normal;font-weight:400;
  font-display:swap;src:url(fonts/lateef-arabic-400.woff2) format("woff2")}
@font-face{font-family:"Scheherazade New";font-style:normal;font-weight:400;
  font-display:swap;src:url(fonts/scheherazade-new-arabic-400.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Sans Arabic";font-style:normal;font-weight:400;
  font-display:swap;src:url(fonts/ibm-plex-sans-arabic-400.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Sans Arabic";font-style:normal;font-weight:700;
  font-display:swap;src:url(fonts/ibm-plex-sans-arabic-700.woff2) format("woff2")}

/* ══════════ هوية «صدقة جارية» ══════════ */
:root{
  --mushaf-bg:#f7f2e6; --mushaf-ink:#181410; --mushaf-shade:rgba(120,95,30,.05);
  --bar:#f3ede0; --bar-ink:#3a3120; --bar-line:rgba(169,130,46,.35);
  --gold:#c9a24b; --gold-strong:#8a6224;
  --font-ui:"IBM Plex Sans Arabic",system-ui,sans-serif;
  /* Lateef مضغوط أفقياً: سطر المصحف يخرج ١٤٫٧em بدل ٢٣٫٢، فيتّسع الخطّ
     أكبر بنحو ٥٧٪ في الصفحة الكاملة نفسها */
  --font-quran:"Lateef","Scheherazade New","Noto Naskh Arabic","Geeza Pro",serif;
}
/* الوضع الليلي: يتبع الجهاز ما لم يختر المستخدم صراحةً.
   data-theme على <html> يحسم الأمر في الاتجاهين. */
@media (prefers-color-scheme:dark){
  :root:not([data-theme="day"]){
    --mushaf-bg:#0f1a15; --mushaf-ink:#e6dcc0; --mushaf-shade:rgba(217,181,88,.05);
    --bar:#0a1712; --bar-ink:#f0e4bf; --bar-line:rgba(217,181,88,.3);
    --gold:#d9b558; --gold-strong:#e3c87b;
  }
}
:root[data-theme="night"]{
  --mushaf-bg:#0f1a15; --mushaf-ink:#e6dcc0; --mushaf-shade:rgba(217,181,88,.05);
  --bar:#0a1712; --bar-ink:#f0e4bf; --bar-line:rgba(217,181,88,.3);
  --gold:#d9b558; --gold-strong:#e3c87b;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{font-family:var(--font-ui);-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}

#reader{position:fixed;inset:0;display:flex;flex-direction:column;
  background:radial-gradient(130% 90% at 50% 42%,var(--mushaf-shade),transparent 70%),var(--mushaf-bg)}

/* ── الشريط العلوي: فهرس · السورة والصفحة · بحث ── */
#top{flex:0 0 auto;z-index:20;display:flex;align-items:center;gap:6px;
  padding:calc(env(safe-area-inset-top) + 5px) 8px 5px;
  background:var(--bar);border-bottom:1px solid var(--bar-line)}
#top button{flex:0 0 auto;width:46px;height:40px;
  display:flex;align-items:center;justify-content:center;
  border:none;background:transparent;color:var(--gold-strong);cursor:pointer;border-radius:12px}
#top button:active{transform:scale(.92)}
#top button svg{width:25px;height:25px;fill:none;stroke:currentColor;
  stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#label{flex:1;min-width:0;text-align:center;overflow:hidden}
/* خرطوش اسم السورة — على هيئة إطار عنوان السورة في المصحف:
   حدٌّ ذهبي، وخطٌّ داخلي رفيع، ومعيّنان على الطرفين. */
.cart{position:relative;display:inline-flex;align-items:center;
  max-width:calc(100% - 26px);padding:4px 15px;
  border:1.5px solid var(--gold);border-radius:8px;
  box-shadow:inset 0 0 0 2.5px var(--bar), inset 0 0 0 3.5px var(--bar-line);
  color:var(--gold-strong);vertical-align:middle}
.cart::before,.cart::after{content:"";position:absolute;top:50%;
  width:7px;height:7px;margin-top:-3.5px;background:var(--gold);transform:rotate(45deg)}
.cart::before{right:-4.5px}
.cart::after{left:-4.5px}
.cart .nm{font-size:15.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cart .sep{flex:0 0 auto;width:1px;height:15px;margin:0 10px;background:var(--bar-line)}
.cart .pg{flex:0 0 auto;font-size:15px;font-weight:700;opacity:.85}

body.immersive #top{display:none}

/* ── الصفحة: خمسة عشر سطراً ── */
#page{flex:1 1 auto;min-height:0;position:relative;
  display:flex;flex-direction:column;justify-content:center;
  padding:5px 10px;
  font-family:var(--font-quran);color:var(--mushaf-ink);
  font-kerning:none;-webkit-font-smoothing:antialiased;
  opacity:1;transition:opacity .18s;
  -webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
#page.loading{opacity:0}
#page.scroll-mode{justify-content:flex-start;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
/* نمط التدفّق: نصّ متّصل بأكبر خطّ ممكن، والتمرير عمودي */
#page.flow{display:block;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
  text-align:justify;text-align-last:center;line-height:2.05}
#page.flow .m-line{display:block;white-space:normal}
#page.flow .head-box{font-size:.52em}

/* السطر يُمطّ من الحافة إلى الحافة — كما في المصحف */
.m-line{display:flex;justify-content:space-between;align-items:center;
  width:100%;white-space:nowrap;line-height:1;flex:0 0 auto;
  gap:.14em}   /* أدنى فاصل بين الكلمات: بدونه تتلاصق في السطر الممتلئ */
.m-line.center{justify-content:center}
.m-w{display:inline-block}

/* عنوان السورة والبسملة */
.m-line.head{justify-content:center}
.head-box{display:inline-block;padding:.16em 1.1em;
  border:1.5px solid var(--bar-line);border-radius:.5em;
  color:var(--gold-strong);font-family:var(--font-ui);
  font-size:.5em;font-weight:700;line-height:1.9}
.basmala{color:var(--gold-strong);font-size:.86em}

/* رقم الآية */
.num{display:inline-block;min-width:1.5em;height:1.5em;line-height:1.5em;
  margin:0 .1em;border:1.5px solid var(--gold);border-radius:50%;
  color:var(--gold-strong);font-family:var(--font-ui);font-size:.4em;font-weight:700;
  text-align:center;vertical-align:middle}

/* ── الألواح والتبويبات ── */
#panes{flex:1 1 auto;min-height:0;position:relative}
.pane{position:absolute;inset:0;display:none;flex-direction:column}
.pane.on{display:flex}

#tabs{flex:0 0 auto;z-index:20;display:flex;
  padding:6px 8px calc(env(safe-area-inset-bottom) + 6px);
  background:var(--bar);border-top:1px solid var(--bar-line)}
#tabs button{flex:1;min-width:0;height:58px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  border:none;background:transparent;border-radius:14px;cursor:pointer;
  color:var(--bar-ink);opacity:.55;font-family:var(--font-ui);
  transition:opacity .18s,background .18s}
#tabs button svg{width:23px;height:23px;fill:none;stroke:currentColor;
  stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
#tabs button b{font-size:12.5px;font-weight:700}
/* التبويب المختار: خلفية ذهبية صريحة لا خطّ رفيع — تُرى من بعيد */
#tabs button.on{opacity:1;color:var(--gold-strong);background:var(--mushaf-shade)}
#tabs button.on svg{stroke-width:2.3}
body.immersive #tabs{display:none}

/* رأس اللوح */
.pane-head{flex:0 0 auto;display:flex;align-items:center;gap:6px;
  padding:calc(env(safe-area-inset-top) + 8px) 10px 8px;
  background:var(--bar);border-bottom:1px solid var(--bar-line)}
.pane-head b{flex:1;text-align:center;font-size:17px;font-weight:700;color:var(--gold-strong)}
.pane-head .pad{width:46px;flex:0 0 auto}
.pane-head button{width:46px;height:40px;flex:0 0 auto;border:none;background:transparent;
  color:var(--gold-strong);cursor:pointer;border-radius:12px}
.pane-head button svg{width:24px;height:24px;fill:none;stroke:currentColor;
  stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pane-body{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:10px 12px calc(env(safe-area-inset-bottom) + 16px)}

/* ── لوح المتابعة ── */
.card{border:1px solid var(--bar-line);border-radius:18px;padding:16px;
  margin-bottom:12px;background:var(--bar);color:var(--bar-ink)}
.prog{position:relative;width:158px;height:158px;margin:2px auto 14px}
.prog .ring{width:100%;height:100%;transform:rotate(-90deg)}
.prog .ring circle{fill:none;stroke-width:10;stroke-linecap:round}
.prog .ring .bg{stroke:var(--bar-line)}
.prog .ring .fg{stroke:var(--gold);transition:stroke-dasharray .6s ease}
.prog-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:40px;font-weight:700;color:var(--gold-strong);letter-spacing:-1px}
.prog-sub{text-align:center;font-size:16px;line-height:1.8}
.stats{display:flex;gap:10px}
.stat{flex:1;text-align:center;border:1px solid var(--bar-line);border-radius:14px;padding:12px 6px}
.stat b{display:block;font-size:26px;font-weight:700;color:var(--gold-strong)}
.stat span{display:block;font-size:12px;opacity:.68;margin-top:3px}
.card h3{font-size:15.5px;font-weight:700;margin-bottom:10px;color:var(--gold-strong)}
/* ── صفحة المصحف المتجهة (SVG) ── */
#page.svgmode{display:flex;align-items:center;justify-content:center;padding:4px}
#page.svgmode svg{width:100%;height:100%;display:block}
/* الحبر مرسوم بلون ثابت في الملف؛ نتجاوزه ليتبع الوضع الغامق */
#page.svgmode svg [fill="#231f20"]{fill:var(--mushaf-ink)}
/* المضلّعات شفّافة تماماً، فلا تتلقّى اللمس إلا بهذا */
#page.svgmode .ayahPolygon{cursor:pointer;pointer-events:all}

/* ── لوح الآية (بضغطة مطوّلة) ── */
#backdrop{position:fixed;inset:0;z-index:75;background:rgba(0,0,0,.35);
  opacity:0;pointer-events:none;transition:opacity .22s}
#backdrop.show{opacity:1;pointer-events:auto}
#asheet{position:fixed;left:0;right:0;bottom:0;z-index:80;
  background:var(--bar);border-top:1.5px solid var(--gold);
  border-radius:20px 20px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.28);
  padding:14px 14px calc(env(safe-area-inset-bottom) + 14px);
  transform:translateY(102%);transition:transform .26s ease;color:var(--bar-ink)}
#asheet.show{transform:none}
.ash-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.ash-head b{flex:1;font-size:16px;font-weight:700;color:var(--gold-strong)}
.ash-head button{width:40px;height:36px;border:none;background:transparent;
  color:var(--bar-ink);cursor:pointer;font-size:24px;line-height:1;opacity:.7}
.ash-text{font-family:var(--font-quran);font-size:23px;line-height:2;
  max-height:26vh;overflow-y:auto;margin-bottom:12px;color:var(--mushaf-ink)}
.ash-acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
/* ثلاثة أزرار: الثالث يمتدّ على العرض كلّه فلا يبقى فراغ أعرج */
.ash-acts button:last-child{grid-column:1 / -1}
.ash-acts button{height:52px;border:1.5px solid var(--bar-line);border-radius:14px;
  background:transparent;color:var(--bar-ink);cursor:pointer;
  font-family:var(--font-ui);font-size:15px;font-weight:700}
.ash-acts button:active{background:var(--mushaf-shade)}
#ashNoteBox{width:100%;margin-top:10px;min-height:96px;padding:12px;
  border:1.5px solid var(--bar-line);border-radius:14px;background:transparent;
  color:var(--bar-ink);font-family:var(--font-ui);font-size:16px;line-height:1.9;resize:vertical}
#ashNoteBox:focus{outline:none;border-color:var(--gold)}

/* ── شرائح الفهرس ── */
.seg{display:flex;gap:8px;margin-bottom:10px}
.seg button{flex:1;height:46px;border:1.5px solid var(--bar-line);border-radius:14px;
  background:transparent;color:var(--bar-ink);cursor:pointer;
  font-family:var(--font-ui);font-size:15px;font-weight:700}
.seg button.on{background:var(--gold);color:#2a2313;border-color:var(--gold)}

/* ── بطاقة الحواشي والعلامات ── */
.note{border:1px solid var(--bar-line);border-radius:14px;padding:12px;margin-bottom:8px}
.note .nh{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.note .nh b{flex:1;font-size:14.5px;font-weight:700;color:var(--gold-strong)}
.note .nh button{border:none;background:transparent;color:var(--bar-ink);
  opacity:.6;cursor:pointer;font-size:20px;line-height:1;padding:0 4px}
.note p{font-size:15.5px;line-height:1.85;white-space:pre-wrap}
.ver{text-align:center;font-size:12px;opacity:.42;padding:6px 0 2px;
  color:var(--bar-ink);font-variant-numeric:tabular-nums}
.ghost{width:100%;height:48px;border:1.5px solid var(--bar-line);border-radius:14px;
  background:transparent;color:var(--gold-strong);cursor:pointer;
  font-family:var(--font-ui);font-size:15px;font-weight:700;margin-top:4px}

/* صفٌّ كبير يسهل ضغطه */
.row{display:flex;align-items:center;gap:12px;width:100%;
  padding:13px 12px;margin-bottom:7px;
  border:1px solid var(--bar-line);border-radius:14px;
  background:transparent;color:var(--bar-ink);cursor:pointer;
  text-align:right;font-family:var(--font-ui)}
.row:active{background:var(--mushaf-shade)}
.row .n{flex:0 0 auto;width:36px;height:36px;line-height:34px;text-align:center;
  border:1.5px solid var(--gold);border-radius:50%;
  color:var(--gold-strong);font-size:13.5px;font-weight:700}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-size:18px;font-weight:700}
.row .t span{display:block;font-size:12.5px;opacity:.62;margin-top:3px}
.row .t i{display:block;font-style:normal;font-family:var(--font-quran);
  font-size:19px;line-height:1.95;margin-top:4px}
#q{width:100%;padding:14px;font-size:18px;font-family:var(--font-ui);
  border:1.5px solid var(--bar-line);border-radius:14px;
  background:transparent;color:var(--bar-ink)}
#q:focus{outline:none;border-color:var(--gold)}
.hint{padding:26px 12px;text-align:center;font-size:15px;
  opacity:.6;color:var(--bar-ink);line-height:1.9}

#msg{position:fixed;inset:0;display:none;align-items:center;justify-content:center;
  padding:32px;text-align:center;font-size:19px;line-height:1.9;
  color:var(--mushaf-ink);background:var(--mushaf-bg);z-index:50}
#msg.show{display:flex}
</style>
</head>
<body>

<div id="reader">
  <div id="panes">

    <section class="pane on" id="paneMushaf">
      <div id="top">
        <button id="themeBtn" aria-label="الوضع النهاري والليلي">
          <svg id="themeIcon" viewBox="0 0 24 24"></svg>
        </button>
        <div id="label"></div>
        <button id="markBtn" aria-label="علامة مرجعية">
          <svg id="markIcon" viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4.5L6 21z"/></svg>
        </button>
      </div>
      <div id="page"></div>
    </section>

    <section class="pane" id="paneTrack">
      <div class="pane-head"><span class="pad"></span><b>متابعة القراءة</b><span class="pad"></span></div>
      <div class="pane-body" id="trackBody"></div>
    </section>

    <section class="pane" id="paneIndex">
      <div class="pane-head"><span class="pad"></span><b>الفهرس والبحث</b><span class="pad"></span></div>
      <div class="pane-body">
        <div class="seg">
          <button id="segSuras" class="on">السور</button>
          <button id="segJuz">الأجزاء</button>
        </div>
        <input id="q" type="search" placeholder="كلمة من القرآن · اسم سورة · رقم صفحة" autocomplete="off"/>
        <div id="qOut"></div>
      </div>
    </section>

  </div>

  <nav id="tabs">
    <button data-tab="paneMushaf" class="on">
      <svg viewBox="0 0 24 24"><path d="M12 6c-2-1.5-4.5-2-8-2v14c3.5 0 6 .5 8 2 2-1.5 4.5-2 8-2V4c-3.5 0-6 .5-8 2zM12 6v14"/></svg>
      <b>المصحف</b>
    </button>
    <button data-tab="paneTrack">
      <svg viewBox="0 0 24 24"><path d="M3 17l5-5 4 4 8-8M21 8v5h-5"/></svg>
      <b>المتابعة</b>
    </button>
    <button data-tab="paneIndex">
      <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
      <b>الفهرس</b>
    </button>
  </nav>
</div>

<div id="backdrop"></div>
<div id="asheet">
  <div class="ash-head">
    <b id="ashTitle"></b>
    <button id="ashClose" aria-label="إغلاق">×</button>
  </div>
  <div class="ash-text" id="ashText"></div>
  <div class="ash-acts">
    <button id="ashCopyRef">نسخ الآية</button>
    <button id="ashShare">مشاركة الآية</button>
    <button id="ashNote">حاشية</button>
  </div>
  <textarea id="ashNoteBox" placeholder="اكتب حاشيتك على هذه الآية…" hidden></textarea>
  <button class="ghost" id="ashSaveNote" hidden>حفظ الحاشية</button>
</div>

<div id="msg" class="show">جارِ فتح المصحف…</div>

<script>
'use strict';

const CFG = {
  // 'svg'    = صفحة مصحف المدينة المطبوعة نفسها، رسماً متجهاً (المطابقة التامّة)
  // 'block'  = إطار واحد لكل الصفحات: مقاس خطّ واحد وكل سطر يملأ العرض.
  //            حدود الصفحات مطابقة للمصحف، ومواضع قطع الأسطر داخلها لا.
  // 'mushaf' = أسطر مصحف المدينة كما هي (مطابقة تامّة، مقاس متغيّر ١٥→٤١)
  // 'flow'   = نصّ متدفّق بخطّ كبير مع تمرير
  LAYOUT    : 'svg',
  DATA      : 'quran-shubah.json',
  SVG_DIR   : 'pages',     // NNN.svg.br تُقدَّم بترويسة Content-Encoding: br
  STORE_KEY : 'shubah:lastPage',
  VERSION   : '2026-09-05',   // تظهر أسفل لوح المتابعة: تعرف أي نسخة عنده
  REF       : 44,          // حجم مرجعي للقياس
  MAX_SIZE  : 46,          // سقف حجم الخطّ (للشاشات العريضة)
  // [سعة السطر بوحدة em, أقصى عدد أسطر تحتاجه صفحة في المصحف كلّه].
  // قيست على الصفحات الـ٦٠٤ بخطّ Lateef. كلّما ضاقت السعة كبُر الخطّ
  // واحتاجت الصفحة أسطراً أكثر، فنختار أضيق سعة يتّسع ارتفاعها في الشاشة.
  EM_TABLE  : [[11,22],[11.5,22],[12,20],[12.5,19],[13,19],[13.5,18],[14,18],
               [14.5,17],[15,17],[15.5,16],[16,16],[16.5,16],[17,15],[17.5,15],
               [18,14],[18.5,14],[19,14]]
};

const BASMALA = 'بِسۡمِ ٱللَّهِ ٱلرَّحۡمَٰنِ ٱلرَّحِيمِ';

const $ = id => document.getElementById(id);
const pageEl = $('page'), labelEl = $('label'), msgEl = $('msg');

const arNum = n => String(n).replace(/[0-9]/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);

let SURAS = {}, PAGES = new Map(), TOTAL = 604, current = 0;
let VERSES = [];            // كل الآيات: للبحث
let SURA_PAGE = {};         // رقم السورة → صفحتها الأولى
let curEm = null;           // سعة السطر المختارة لهذه الشاشة
let currentRows = [];   // صفوف الصفحة المعروضة مع عرض كل صفّ عند الحجم المرجعي

/* ══════════ تحميل المصحف مرّة واحدة ══════════ */
async function loadQuran(){
  const r = await fetch(CFG.DATA);
  if(!r.ok) throw new Error('data');
  const d = await r.json();
  SURAS = d.suras;
  // v = [[سورة, آية, صفحة, أوّل سطر, آخر سطر, نصّ], …]
  d.v.forEach(row => {
    const a = { sura:row[0], aya:row[1], page:row[2], ls:row[3], le:row[4], text:row[5] };
    if(!PAGES.has(a.page)) PAGES.set(a.page, []);
    PAGES.get(a.page).push(a);
  });
  TOTAL = Math.max(...PAGES.keys());
  d.v.forEach(row => {
    const v = {sura:row[0], aya:row[1], page:row[2], text:row[5]};
    VERSES.push(v);
    if(!SURA_PAGE[v.sura] || v.page < SURA_PAGE[v.sura]) SURA_PAGE[v.sura] = v.page;
  });
}

/* ══════════ التجريد للبحث ══════════
   نجرّد الحركات وعلامات الوقف ونوحّد صور الألف والتاء والياء، فيجد
   القارئُ كلمتَه كما ينطقها لا كما تُرسم بالضبط. */
const STRIP = /[\u064B-\u065F\u0670\u06D6-\u06ED\u0640]/g;
function norm(t){
  return t.replace(STRIP, '')
          .replace(/[\u0622\u0623\u0625\u0671]/g, '\u0627')
          .replace(/\u0629/g, '\u0647')
          .replace(/\u0649/g, '\u064A')
          .replace(/\s+/g, ' ').trim();
}
let searchReady = false;
function buildSearchIndex(){
  if(searchReady) return;
  VERSES.forEach(v => { v.n = norm(v.text); });
  searchReady = true;
}

/* ══════════ توزيع الآيات على أسطر الصفحة ══════════
   البيانات تعطي لكل آية أوّل سطر وآخر سطر في مصحف المدينة، فنلتزم بهما:
   لا نبدأ آية قبل سطرها، ونُنهي الآية كاملةً في سطرها الأخير. أمّا موضع
   القطع داخل آية تمتدّ على أسطر فيُحسب بقياس عرض الكلمات. */
function composeLines(ayat, ctx){
  const maxLine = ayat.reduce((m,a) => Math.max(m, a.le), 1);

  // الأسطر التي لا تشغلها آية = عنوان سورة (+ بسملة)
  const covered = new Set();
  ayat.forEach(a => { for(let L=a.ls; L<=a.le; L++) covered.add(L); });
  const special = new Map();
  ayat.filter(a => a.aya === 1).forEach(a => {
    const free = [];
    for(let L=a.ls-1; L>=1 && !covered.has(L); L--) free.unshift(L);
    if(free.length >= 2){
      special.set(free[free.length-2], {t:'head', s:a.sura});
      special.set(free[free.length-1], {t:'bas'});
    }else if(free.length === 1){
      special.set(free[0], {t:'head', s:a.sura});
    }
  });

  // طابور الرموز: كل كلمة، ثمّ رقم الآية في آخرها
  const queue = [];
  ayat.forEach(a => {
    a.text.split(/\s+/).filter(Boolean).forEach(w => queue.push({txt:w, a:a}));
    queue.push({num:a.aya, a:a});
  });
  // كم رمزاً بقي لكل آية
  const left = new Map();
  queue.forEach(t => left.set(t.a, (left.get(t.a) || 0) + 1));

  const width = t => t.num !== undefined ? CFG.REF * 0.62 : ctx.measureText(t.txt).width;
  const SPACE = ctx.measureText(' ').width;

  // سعة السطر تُشتقّ من محتوى الصفحة نفسها، لا من تقدير خارجي:
  // مجموع عرض الرموز موزّعاً على عدد أسطر النصّ. هكذا يستقيم التوزيع
  // مهما كان عرض الشاشة، فالحجم النهائي يضبطه autofit بعدُ.
  const textLines = covered.size || 1;
  let total = 0;
  queue.forEach((t, i) => { total += width(t) + (i ? SPACE : 0); });
  const cap = total / textLines;

  const out = [];
  for(let L=1; L<=maxLine; L++){
    if(special.has(L)){ out.push({special:special.get(L)}); continue; }
    if(!covered.has(L)){ out.push({items:[]}); continue; }

    const items = [];
    let w = 0;
    while(queue.length){
      const t = queue[0];
      if(t.a.ls > L) break;                       // آيةٌ سطرُها لاحق
      const mustEnd = (t.a.le === L);             // الآية تنتهي في هذا السطر
      if(!mustEnd){
        // اترك رمزاً واحداً على الأقلّ لكلّ سطر باقٍ من هذه الآية
        if(left.get(t.a) <= t.a.le - L) break;
      }
      const tw = width(t) + (items.length ? SPACE : 0);
      // الآية المنتهية في هذا السطر تُؤخذ كاملةً ولو فاض (يُضغط أفقياً لاحقاً).
      // بلا هذا الاستثناء تسقط آيةٌ تنتهي مع أختها في السطر الأخير.
      if(!mustEnd && items.length && w + tw > cap) break;
      items.push(queue.shift());
      left.set(t.a, left.get(t.a) - 1);
      w += tw;
    }
    out.push({items:items, w:items.reduce((a,t) => a + width(t), 0)});
  }

  // شبكة أمان: لا يجوز أن تسقط كلمة من المصحف مهما اختلّ الحساب
  if(queue.length){
    for(let i=out.length-1; i>=0; i--){
      if(out[i].items){
        const rest = queue.splice(0);
        out[i].items.push(...rest);
        out[i].w += rest.reduce((a,t) => a + width(t), 0);
        break;
      }
    }
  }
  return out;
}

/* ══════════ بناء الصفحة ══════════ */
// نمط الإطار الواحد: تُقطع الأسطر لتملأ سعةً ثابتة (LINE_EM)، فيخرج مقاس
// الخطّ نفسه في كل صفحات المصحف. الصفحة تبقى صفحة المصحف، والقطع داخلها لنا.
// أضيق سعة سطر يتّسع ارتفاعها في الشاشة: كلّما ضاقت كبُر الخطّ وكثرت
// الأسطر. إخفاء الشريط العلوي يزيد الارتفاع فتُختار سعة أضيق تلقائياً.
function pickEm(){
  const pcs = getComputedStyle(pageEl);
  const avail = pageEl.clientWidth - parseFloat(pcs.paddingRight) - parseFloat(pcs.paddingLeft);
  const usableH = pageEl.clientHeight - parseFloat(pcs.paddingTop) - parseFloat(pcs.paddingBottom);
  const T = CFG.EM_TABLE;
  for(let i = 0; i < T.length; i++){
    const em = T[i][0], maxLines = T[i][1];
    const size = avail / em * 0.985;
    if(size <= CFG.MAX_SIZE && maxLines * size * 1.62 <= usableH) return {em:em, maxLines:maxLines};
  }
  return {em:T[T.length-1][0], maxLines:T[T.length-1][1]};
}

function composeBlock(ayat, ctx){
  const REF = CFG.REF, GAP = 0.14, cap = (curEm || (curEm = pickEm())).em;
  const rows = [];
  let items = [], sum = 0;
  const flush = () => { if(items.length){ rows.push({items:items, w:sum}); items=[]; sum=0; } };

  ayat.forEach(a => {
    if(a.aya === 1){
      flush();
      rows.push({special:{t:'head', s:a.sura}});
      if(a.sura !== 1 && a.sura !== 9) rows.push({special:{t:'bas'}});
    }
    const toks = a.text.split(/\s+/).filter(Boolean).map(t => ({txt:t, a:a}));
    toks.push({num:a.aya, a:a});
    toks.forEach(t => {
      const tw = (t.num !== undefined) ? REF * 0.62 : ctx.measureText(t.txt).width;
      // العرض بوحدة em لو أضفنا هذا الرمز: المجموع زائد فاصلاً لكل ما سبقه
      const need = (sum + tw) / REF + GAP * items.length;
      if(items.length && need > cap) flush();
      items.push(t);
      sum += tw;
    });
  });
  flush();
  return rows;
}

// نمط التدفّق: نفس آيات الصفحة وعنوانها وبسملتها، بلا التزام بمواضع الأسطر
function buildFlow(ayat){
  const frag = document.createDocumentFragment();
  ayat.forEach(a => {
    if(a.aya === 1){
      const h = document.createElement('div');
      h.className = 'm-line head';
      const b = document.createElement('span');
      b.className = 'head-box';
      b.textContent = 'سورة ' + (SURAS[a.sura] || '');
      h.appendChild(b);
      frag.appendChild(h);
      if(a.sura !== 1 && a.sura !== 9){
        const bs = document.createElement('div');
        bs.className = 'm-line head';
        const x = document.createElement('span');
        x.className = 'basmala';
        x.textContent = BASMALA;
        bs.appendChild(x);
        frag.appendChild(bs);
      }
    }
    frag.appendChild(document.createTextNode(a.text + ' '));
    const n = document.createElement('span');
    n.className = 'num';
    n.textContent = arNum(a.aya);
    frag.appendChild(n);
    frag.appendChild(document.createTextNode(' '));
  });
  pageEl.innerHTML = '';
  pageEl.appendChild(frag);
}

function buildPage(p){
  const ayat = PAGES.get(p) || [];
  if(CFG.LAYOUT === 'flow'){
    currentRows = [];
    buildFlow(ayat);
    return;
  }

  const ctx = buildPage._ctx || (buildPage._ctx = document.createElement('canvas').getContext('2d'));
  ctx.font = CFG.REF + "px " + getComputedStyle(pageEl).fontFamily;
  // القياس بالحجم المرجعي: النِّسَب وحدها تهمّ، وautofit يضبط الحجم النهائي
  if(CFG.LAYOUT === 'block') curEm = pickEm();
  const rows = (CFG.LAYOUT === 'block') ? composeBlock(ayat, ctx) : composeLines(ayat, ctx);
  currentRows = rows;

  const frag = document.createDocumentFragment();
  rows.forEach(row => {
    const el = document.createElement('div');
    el.className = 'm-line';
    if(row.special){
      el.classList.add('head');
      if(row.special.t === 'head'){
        const b = document.createElement('span');
        b.className = 'head-box';
        b.textContent = 'سورة ' + (SURAS[row.special.s] || '');
        el.appendChild(b);
      }else{
        const b = document.createElement('span');
        b.className = 'basmala';
        b.textContent = BASMALA;
        el.appendChild(b);
      }
    }else{
      if(row.items.length < 2) el.classList.add('center');
      row.items.forEach(t => {
        const s = document.createElement('span');
        if(t.num !== undefined){ s.className = 'num'; s.textContent = arNum(t.num); }
        else { s.className = 'm-w'; s.textContent = t.txt; }
        el.appendChild(s);
      });
    }
    frag.appendChild(el);
  });

  pageEl.innerHTML = '';
  pageEl.appendChild(frag);
}

/* ══════════ أكبر خطّ يتّسع في الصفحة ══════════ */
function autofit(){
  const pcs = getComputedStyle(pageEl);
  const avail = pageEl.clientWidth - parseFloat(pcs.paddingRight) - parseFloat(pcs.paddingLeft);
  if(avail <= 0) return;

  if(CFG.LAYOUT === 'flow'){
    // بحث ثنائي عن أكبر حجم يتّسع في الشاشة، بحدّ أدنى مريح للقراءة؛
    // ما لم يتّسع عنده يُمرَّر عمودياً بدل أن يصغُر الخطّ
    const MIN = 27, MAX = 46;
    let lo = MIN, hi = MAX, best = MIN;
    pageEl.style.fontSize = MAX + 'px';
    if(pageEl.scrollHeight <= pageEl.clientHeight) best = MAX;
    else{
      while(lo <= hi){
        const mid = Math.floor((lo + hi) / 2);
        pageEl.style.fontSize = mid + 'px';
        if(pageEl.scrollHeight <= pageEl.clientHeight){ best = mid; lo = mid + 1; }
        else hi = mid - 1;
      }
    }
    pageEl.style.fontSize = best + 'px';
    pageEl.scrollTop = 0;
    return;
  }

  const REF = CFG.REF;
  pageEl.style.fontSize = REF + 'px';

  const lines = [...pageEl.querySelectorAll('.m-line')];
  if(!lines.length) return;

  if(CFG.LAYOUT === 'block'){
    // المقاس مشتقّ من سعة السطر الثابتة وحدها، فهو واحدٌ في كل صفحة
    const usableH0 = pageEl.clientHeight - parseFloat(pcs.paddingTop) - parseFloat(pcs.paddingBottom);
    const pick = curEm || (curEm = pickEm());
    let size = Math.max(12, avail / pick.em * 0.985);
    // التباعد يُقسم على أقصى عدد أسطر تحتاجه صفحة في المصحف كلّه، لا على
    // أسطر هذه الصفحة، فيخرج إيقاع الصفحات واحداً. والأقصر تُتوسَّط رأسياً.
    const slot0 = usableH0 / Math.max(pick.maxLines, lines.length);
    // صمّام: لو خرجت صفحة بأسطر أكثر من المتوقّع لا ندع السطور تتداخل
    if(size * 1.62 > slot0) size = slot0 / 1.62;
    pageEl.style.fontSize = size + 'px';
    // السطر القصير (آخر سطر في الصفحة أو ما قبل عنوان سورة) لا يُمطّ:
    // مطّ خمس كلمات على عرض الصفحة يترك فجواتٍ تُشتّت العين.
    const GAP0 = 0.14;
    lines.forEach((l, i) => {
      l.style.height = slot0 + 'px';
      l.style.transform = '';
      const row = currentRows[i];
      if(!row || !row.items){ l.classList.remove('center'); return; }
      const w = row.w * size / REF + GAP0 * size * Math.max(0, row.items.length - 1);
      l.classList.toggle('center', w < avail * 0.8);
    });
    return;
  }

  // العرض المرسوم لكل سطر مقيسٌ عند بناء الصفحة (canvas)، لا من الـDOM:
  // scrollWidth لا يحسب الفيض عند حافة البدء في اتجاه RTL، فكان القياس
  // ناقصاً والحجم أكبر ممّا يتّسع، فتُقصّ أوّل كلمة من السطر.
  const GAP = 0.14;   // الفاصل بين الكلمات بوحدة em (نفس قيمة gap في CSS)
  const nat = lines.map((l,i) => (currentRows[i] && currentRows[i].w) || 0);
  const gaps = lines.map((l,i) => Math.max(0, ((currentRows[i] && currentRows[i].items) || []).length - 1));
  // أوسع سطر: العرض دالّةٌ في الحجم = w·(size/REF) + GAP·size·(عدد الفواصل)
  const need = nat.map((w,i) => w / REF + GAP * gaps[i]);
  const maxNeed = Math.max(...need, 0.001);

  const usableH = pageEl.clientHeight - parseFloat(pcs.paddingTop) - parseFloat(pcs.paddingBottom);
  // نقسم الارتفاع على أسطر الصفحة الفعلية لا على ١٥ دائماً: صفحتا الفاتحة
  // والبقرة الأوليان أقلّ أسطراً، فتخرجان بخطّ كبير كما في مصحف المدينة
  const slot = usableH / lines.length;
  const sizeW = Math.max(12, avail / maxNeed * 0.985);      // هامش أمان ١٫٥٪

  // الحدّ الذي يفرضه الارتفاع: نقيس أعلى «حبر» مرسوم فعلياً في أي سطر
  // (بما فيه الحركات وعلامات الوقف) بدل ثابتٍ مقدّر، فيتبع الحجمُ الخطَّ
  // المستعمل مهما كان بدل أن نترك فراغاً لا داعي له.
  let maxInk = 0;
  try{
    const ictx = autofit._ctx || (autofit._ctx = document.createElement('canvas').getContext('2d'));
    ictx.font = REF + 'px ' + getComputedStyle(pageEl).fontFamily;
    lines.forEach(l => {
      if(l.classList.contains('head')) return;
      const m = ictx.measureText(l.textContent);
      const ink = (m.actualBoundingBoxAscent || 0) + (m.actualBoundingBoxDescent || 0);
      if(ink > maxInk) maxInk = ink;
    });
  }catch(_){}
  const sizeH = maxInk > 0 ? REF * (slot * 1.02) / maxInk : slot / 1.62;

  // شاشة قصيرة أو أفقية: أكبر خط ممكن + تمرير عمودي (أوضح لكبار السن)
  const shortH = (window.matchMedia && window.matchMedia('(orientation: landscape)').matches)
                 || pageEl.clientHeight < pageEl.clientWidth * 0.9;
  const size = (shortH && sizeH < sizeW - 1)
    ? Math.min(56, sizeW)
    : Math.max(12, Math.min(sizeW, sizeH));

  pageEl.classList.toggle('scroll-mode', shortH && sizeH < sizeW - 1);
  pageEl.style.fontSize = size + 'px';
  if(pageEl.classList.contains('scroll-mode')) pageEl.scrollTop = 0;

  lines.forEach((l,i) => {
    l.style.height = (pageEl.classList.contains('scroll-mode') ? size * 1.9 : slot) + 'px';
    if(l.classList.contains('head')) return;
    const w = nat[i] * size / REF + GAP * size * gaps[i];
    l.style.transform = '';
    if(w > avail + 1){
      // سطر فائض: يُضغط أفقياً بدل أن يُقصّ
      l.style.transformOrigin = 'right center';
      l.style.transform = 'scaleX(' + (avail / w).toFixed(4) + ')';
      l.classList.remove('center');
    }else{
      // السطر القصير يُتوسَّط بدل أن يُمطّ بفجوات (كأسطر الفاتحة)
      l.classList.toggle('center', w < avail * 0.78);
    }
  });
}

/* ══════════ صفحة المصحف المتجهة ══════════
   الملفّات مضغوطة بـBrotli ويفكّها المتصفّح من تلقائه متى أرسل الخادم
   ترويسة Content-Encoding: br (انظر vercel.json و serve.py). */
const SVG_CACHE = new Map();

async function fetchSvg(p){
  const key = String(p).padStart(3, '0');
  if(SVG_CACHE.has(key)) return SVG_CACHE.get(key);
  const r = await fetch(CFG.SVG_DIR + '/' + key + '.svg.br');
  if(!r.ok) throw new Error('page ' + p);
  const t = await r.text();
  if(t.charCodeAt(0) !== 60)          // ليست '<': الخادم لم يفكّ الضغط
    throw new Error('br-header');
  if(SVG_CACHE.size > 6) SVG_CACHE.delete(SVG_CACHE.keys().next().value);
  SVG_CACHE.set(key, t);
  return t;
}

let svgToken = 0;
async function renderSvg(p){
  const token = ++svgToken;
  pageEl.classList.add('loading');
  current = p;
  try{ localStorage.setItem(CFG.STORE_KEY, String(p)); }catch(_){}
  setLabel(p);
  try{
    const t = await fetchSvg(p);
    if(token !== svgToken) return;
    pageEl.innerHTML = t;
    pageEl.classList.remove('loading');
    // ثماني ثوانٍ على الصفحة = قراءة. أقلّ من ذلك تقليبٌ لا قراءة.
    clearTimeout(markTimer);
    markTimer = setTimeout(() => { if(current === p) markRead(p); }, 8000);
    // تحميل مسبق للصفحة التالية: التقليب يصير فورياً
    if(p < TOTAL) fetchSvg(p + 1).catch(() => {});
  }catch(e){
    if(token !== svgToken) return;
    pageEl.classList.remove('loading');
    pageEl.innerHTML = '';
    msgEl.textContent = (e && e.message === 'br-header')
      ? 'الخادم لا يرسل ترويسة Content-Encoding: br'
      : 'تعذّر فتح الصفحة — تحقّق من الاتصال';
    msgEl.classList.add('show');
    setTimeout(() => msgEl.classList.remove('show'), 2600);
  }
}

/* ══════════ العرض ══════════ */
function render(p){
  if(CFG.LAYOUT === 'svg'){ pageEl.classList.add('svgmode'); renderSvg(p); return; }
  pageEl.classList.add('loading');
  current = p;
  try{ localStorage.setItem(CFG.STORE_KEY, String(p)); }catch(_){}

  const draw = () => {
    pageEl.classList.toggle('flow', CFG.LAYOUT === 'flow');
    buildPage(p);
    autofit();
    pageEl.classList.remove('loading');
    setLabel(p);
  };
  // ننتظر جاهزية الخطّ قبل القياس وإلّا قِسنا خطّاً بديلاً بمقاسات مختلفة.
  // صمّام أمان ٣ ثوانٍ: فشل الخطّ لا يترك الصفحة بيضاء.
  if(document.fonts && document.fonts.ready){
    Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 3000))])
      .then(draw).catch(draw);
  }else draw();
}

/* ══════════ التنقّل ══════════ */
function setLabel(p){
  const ayat = PAGES.get(p) || [];
  const names = [...new Set(ayat.map(a => SURAS[a.sura]))];
  labelEl.innerHTML = '<span class="cart"><span class="nm">' +
    (names.length ? 'سورة ' + names.join(' · ') : '') +
    '</span><i class="sep"></i><span class="pg">' + arNum(p) + '</span></span>';
  syncMark(p);

/* ══════════ العلامات المرجعية ══════════ */
const MARKS_KEY = 'shubah:marks';
function loadMarks(){
  try{ return JSON.parse(localStorage.getItem(MARKS_KEY)) || []; }catch(_){ return []; }
}
function saveMarks(m){ try{ localStorage.setItem(MARKS_KEY, JSON.stringify(m)); }catch(_){} }
function syncMark(p){
  const on = loadMarks().indexOf(p) !== -1;
  $('markIcon').style.fill = on ? 'currentColor' : 'none';
}
$('markBtn').addEventListener('click', () => {
  const m = loadMarks(), i = m.indexOf(current);
  if(i === -1) m.push(current); else m.splice(i, 1);
  m.sort((a, b) => a - b);
  saveMarks(m);
  syncMark(current);
  if(currentTab === 'paneTrack') renderTrack();
});

/* ══════════ لوح الآية ══════════
   يُفتح بضغطة مطوّلة على الآية — واللمسة القصيرة تبقى لملء الشاشة. */
let ashKey = null;
const verseOf = (su, ay) => VERSES.find(v => v.sura === su && v.aya === ay);

function openAyah(su, ay){
  const v = verseOf(su, ay);
  if(!v) return;
  ashKey = su + ':' + ay;
  $('ashTitle').textContent = 'سورة ' + SURAS[su] + ' · الآية ' + arNum(ay);
  $('ashText').textContent = v.text;
  const notes = loadNotes();
  $('ashNoteBox').value = notes[ashKey] || '';
  $('ashNoteBox').hidden = true;
  $('ashSaveNote').hidden = true;
  $('ashNote').textContent = notes[ashKey] ? 'تعديل الحاشية' : 'حاشية';
  $('asheet').classList.add('show');
  $('backdrop').classList.add('show');
}
function closeAyah(){
  $('asheet').classList.remove('show');
  $('backdrop').classList.remove('show');
}
$('backdrop').addEventListener('click', closeAyah);
$('ashClose').addEventListener('click', closeAyah);

function toast(t){
  msgEl.textContent = t; msgEl.classList.add('show');
  setTimeout(() => msgEl.classList.remove('show'), 1600);
}
async function copyText(t){
  try{ await navigator.clipboard.writeText(t); toast('نُسخت'); }
  catch(_){ toast('تعذّر النسخ'); }
}

/* بطاقة الآية للمشاركة: نقصّ الآية من رسم الصفحة المطبوعة، ثمّ نضعها
   في إطارٍ ذهبي مع مرجعها وتوقيع التطبيق. الورق فاتحٌ دائماً ولو كان
   التطبيق ليلياً — البطاقة تُرسَل إلى غيره لا تُقرأ في الظلام. */
// نُوسّع مستطيلات المضلّع رأسياً قليلاً: حدودها عند حدّ السطر تماماً،
// فتقصّ أطراف الحركات العالية والنازلة لو أخذناها كما هي.
function inflateY(d, dy){
  return d.replace(/M\s*([-\d.]+)[\s,]+([-\d.]+)\s*L\s*([-\d.]+)[\s,]+([-\d.]+)\s*L\s*([-\d.]+)[\s,]+([-\d.]+)\s*L\s*([-\d.]+)[\s,]+([-\d.]+)\s*Z/g,
    (m, x1, y1, x2, y2, x3, y3, x4, y4) => {
      const ys = [y1, y2, y3, y4].map(Number);
      const lo = Math.min(...ys) - dy, hi = Math.max(...ys) + dy;
      const f = y => (Number(y) === Math.min(...ys) ? lo : hi);
      return 'M ' + x1 + ' ' + f(y1) + ' L ' + x2 + ' ' + f(y2) +
             ' L ' + x3 + ' ' + f(y3) + ' L ' + x4 + ' ' + f(y4) + ' Z';
    });
}

async function ayahImage(su, ay){
  const svg = pageEl.querySelector('svg');
  const poly = svg && svg.querySelector('.ayahPolygon[surah="' + su + '"][ayah="' + ay + '"]');
  if(!poly) return null;

  const clone = svg.cloneNode(true);
  clone.querySelectorAll('.ayahPolygon').forEach(e => e.remove());
  clone.querySelectorAll('[fill="#231f20"]').forEach(e => e.setAttribute('fill', '#1a140d'));

  // المضلّع قناعاً: المستطيل الحاوي وحده يجرّ معه ما جاور الآية في أسطرها
  const NS = 'http://www.w3.org/2000/svg';
  const dInf = inflateY(poly.getAttribute('d'), 3);
  const cp = document.createElementNS(NS, 'clipPath');
  cp.setAttribute('id', 'ayahClip');
  const cpPath = document.createElementNS(NS, 'path');
  cpPath.setAttribute('d', dInf);
  cp.appendChild(cpPath);
  // القناع يُوضع على غلافٍ بلا تحويل: مجموعة الرسم تحمل matrix، ولو وُضع
  // عليها لفُسّرت إحداثياته في فضائها المحوَّل لا في فضاء الصفحة فتخرج فارغة
  const wrap = document.createElementNS(NS, 'g');
  wrap.setAttribute('clip-path', 'url(#ayahClip)');
  while(clone.firstChild) wrap.appendChild(clone.firstChild);
  clone.appendChild(cp);
  clone.appendChild(wrap);

  // حدود القصّ من المضلّع الموسَّع نفسه
  const probe = document.createElementNS(NS, 'path');
  probe.setAttribute('d', dInf);
  probe.setAttribute('fill', 'none');
  svg.appendChild(probe);
  const bb = probe.getBBox();
  svg.removeChild(probe);

  const pad = 1;
  clone.setAttribute('viewBox',
    (bb.x - pad) + ' ' + (bb.y - pad) + ' ' + (bb.width + pad * 2) + ' ' + (bb.height + pad * 2));
  const k = 4;
  const w = Math.round((bb.width + pad * 2) * k), h = Math.round((bb.height + pad * 2) * k);
  clone.setAttribute('width', w); clone.setAttribute('height', h);

  const img = new Image();
  await new Promise((res, rej) => {
    img.onload = res; img.onerror = rej;
    img.src = 'data:image/svg+xml;charset=utf-8,' +
      encodeURIComponent(new XMLSerializer().serializeToString(clone));
  });
  return img;
}

function rosette(ctx, cx, cy, r){
  ctx.strokeStyle = '#b8912f'; ctx.fillStyle = '#c9a24b';
  ctx.lineWidth = r * 0.14;
  ctx.beginPath(); ctx.arc(cx, cy, r * 0.62, 0, 7); ctx.stroke();
  for(let a = 0; a < 360; a += 45){
    const t = a * Math.PI / 180;
    ctx.beginPath();
    ctx.arc(cx + Math.cos(t) * r, cy + Math.sin(t) * r, r * 0.12, 0, 7);
    ctx.fill();
  }
  ctx.beginPath(); ctx.arc(cx, cy, r * 0.14, 0, 7); ctx.fill();
}

async function ayahCard(su, ay){
  const img = await ayahImage(su, ay);
  if(!img) return null;
  try{ await document.fonts.load('700 44px "IBM Plex Sans Arabic"'); }catch(_){}

  const W = 1080, M = 64, inner = W - M * 2 - 60;
  const ih = Math.round(img.height * (inner / img.width));
  const H = M + 92 + ih + 54 + 70 + 56 + M;

  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const c = cv.getContext('2d');

  c.fillStyle = '#f7f2e6'; c.fillRect(0, 0, W, H);
  c.strokeStyle = '#b8912f'; c.lineWidth = 4;
  c.strokeRect(M / 2, M / 2, W - M, H - M);
  c.strokeStyle = 'rgba(184,145,47,.45)'; c.lineWidth = 1.5;
  c.strokeRect(M / 2 + 11, M / 2 + 11, W - M - 22, H - M - 22);

  rosette(c, W / 2, M + 34, 22);

  const iy = M + 92;
  c.drawImage(img, M + 30, iy, inner, ih);
  // تلاشٍ أعلى الصورة وأسفلها: ما بقي من حبر السطر المجاور يذوب في الورق
  // بدل أن يظهر مبتوراً بحدٍّ حادّ
  const fade = Math.min(30, ih * 0.14);
  let g = c.createLinearGradient(0, iy, 0, iy + fade);
  g.addColorStop(0, '#f7f2e6'); g.addColorStop(1, 'rgba(247,242,230,0)');
  c.fillStyle = g; c.fillRect(M + 30, iy, inner, fade);
  g = c.createLinearGradient(0, iy + ih - fade, 0, iy + ih);
  g.addColorStop(0, 'rgba(247,242,230,0)'); g.addColorStop(1, '#f7f2e6');
  c.fillStyle = g; c.fillRect(M + 30, iy + ih - fade, inner, fade);

  const ry = M + 92 + ih + 30;
  c.strokeStyle = 'rgba(184,145,47,.5)'; c.lineWidth = 2;
  c.beginPath(); c.moveTo(W * 0.3, ry); c.lineTo(W * 0.7, ry); c.stroke();

  c.direction = 'rtl'; c.textAlign = 'center';
  c.fillStyle = '#8a6224';
  c.font = '700 42px "IBM Plex Sans Arabic", sans-serif';
  c.fillText('سورة ' + SURAS[su] + ' · الآية ' + arNum(ay), W / 2, ry + 60);
  c.fillStyle = 'rgba(58,49,32,.5)';
  c.font = '400 28px "IBM Plex Sans Arabic", sans-serif';
  c.fillText('مصحف شعبة', W / 2, ry + 112);

  return new Promise(r => cv.toBlob(r, 'image/png'));
}

$('ashShare').addEventListener('click', async () => {
  const [su, ay] = ashKey.split(':').map(Number);
  const v = verseOf(su, ay);
  const text = '﴿' + v.text + '﴾\n[' + SURAS[su] + ': ' + ay + ']';
  try{
    const blob = await ayahCard(su, ay);
    if(blob){
      const file = new File([blob], 'ayah-' + su + '-' + ay + '.png', { type:'image/png' });
      if(navigator.canShare && navigator.canShare({ files:[file] })){
        await navigator.share({ files:[file], text:text });
        return;
      }
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'ayah-' + su + '-' + ay + '.png';
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      toast('حُفظت البطاقة');
      return;
    }
    if(navigator.share){ await navigator.share({ text:text }); return; }
    copyText(text);
  }catch(e){
    if(e && e.name === 'AbortError') return;      // ألغى المشاركة
    copyText(text);
  }
});

function ayahAt(target){
  return target && target.closest && target.closest('.ayahPolygon');
}



function goto(n){
  const p = Math.max(1, Math.min(TOTAL, n));
  if(p !== current) render(p);
}
const nextPage = () => goto(current + 1);
const prevPage = () => goto(current - 1);

/* ── لمسةٌ على الصفحة: الشاشة كلّها للمصحف ──
   إخفاء الشريط يزيد الارتفاع المتاح، فتُختار سعة سطر أضيق ويكبر الخطّ.
   لذلك نُعيد بناء الصفحة بعد التبديل لا الضبط وحده. */
function toggleImmersive(){
  const on = !document.body.classList.contains('immersive');
  document.body.classList.toggle('immersive', on);
  // ملء الشاشة الحقيقي مكسبٌ إضافي لا شرط: آيفون لا يدعمه، وبعض السياقات
  // ترفضه. نبتلع الرفض (وعدٌ لا استثناء) فالإخفاء وحده يكفي.
  const swallow = () => {};
  try{
    if(on && document.documentElement.requestFullscreen){
      const r = document.documentElement.requestFullscreen();
      if(r && r.catch) r.catch(swallow);
    }else if(!on && document.fullscreenElement && document.exitFullscreen){
      const r = document.exitFullscreen();
      if(r && r.catch) r.catch(swallow);
    }
  }catch(_){}
  if(CFG.LAYOUT === 'svg') return;   // الرسم المتجه يملأ الحيّز من تلقائه
  requestAnimationFrame(() => { curEm = null; buildPage(current); autofit(); });
}

let sx = 0, sy = 0, moved = 0, tracking = false;
pageEl.addEventListener('touchstart', e => {
  const c = e.changedTouches[0];
  sx = c.clientX; sy = c.clientY; moved = 0; tracking = true;
}, {passive:true});
pageEl.addEventListener('touchmove', e => {
  if(!tracking) return;
  const c = e.changedTouches[0];
  moved = Math.max(moved, Math.hypot(c.clientX - sx, c.clientY - sy));
}, {passive:true});
pageEl.addEventListener('touchend', e => {
  if(!tracking) return;
  tracking = false;
  const c = e.changedTouches[0];
  const dx = c.clientX - sx, dy = c.clientY - sy;
  if(Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 60){
    if(dx > 0) nextPage(); else prevPage();   // اتجاه تقليب المصحف
  }else if(moved < 12){
    // لمسةٌ على آية تفتح لوحها، وعلى هامش الصفحة تُبدّل ملء الشاشة
    const el = ayahAt(e.target);
    if(el) openAyah(+el.getAttribute('surah'), +el.getAttribute('ayah'));
    else toggleImmersive();
  }
});
// الفأرة (سطح المكتب): نقرة على آية تفتحها، وعلى الهامش ملء الشاشة
pageEl.addEventListener('click', e => {
  if('ontouchstart' in window) return;
  const el = ayahAt(e.target);
  if(el) openAyah(+el.getAttribute('surah'), +el.getAttribute('ayah'));
  else toggleImmersive();
});

document.addEventListener('keydown', e => {
  if(e.key === 'ArrowLeft') nextPage();
  else if(e.key === 'ArrowRight') prevPage();
  else if(e.key === 'Escape') switchTab('paneMushaf');
});

const SUN  = '<circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M18.7 5.3l-1.4 1.4M6.7 17.3l-1.4 1.4"/>';
const MOON = '<path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/>';
function applyTheme(t){
  const root = document.documentElement;
  if(t) root.setAttribute('data-theme', t); else root.removeAttribute('data-theme');
  const dark = t === 'night' ||
    (!t && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  // الأيقونة تعرض ما ستصير إليه بالضغط، لا ما هي عليه الآن
  $('themeIcon').innerHTML = dark ? SUN : MOON;
  const m = document.querySelector('meta[name="theme-color"]');
  if(m) m.setAttribute('content', dark ? '#0a1712' : '#f3ede0');
}
$('themeBtn').addEventListener('click', () => {
  const dark = document.documentElement.getAttribute('data-theme') === 'night' ||
    (!document.documentElement.hasAttribute('data-theme') && window.matchMedia &&
     window.matchMedia('(prefers-color-scheme: dark)').matches);
  const next = dark ? 'day' : 'night';
  try{ localStorage.setItem('shubah:theme', next); }catch(_){}
  applyTheme(next);
});

/* ══════════ متابعة القراءة ══════════
   على نهج «صدقة جارية»: الصفحات تُسجَّل تلقائياً أثناء القراءة لا بزرّ.
   read سلسلة ٦٠٤ خانة: خانة لكل صفحة. */
const TRACK_KEY = 'shubah:track';
let TRACK = null, markTimer = null, sessionRead = 0;

function loadTrack(){
  try{ TRACK = JSON.parse(localStorage.getItem(TRACK_KEY)); }catch(_){}
  if(!TRACK || typeof TRACK.read !== 'string' || TRACK.read.length !== 604)
    TRACK = { read:'0'.repeat(604), days:{}, khatmas:0 };
  if(!TRACK.days) TRACK.days = {};
  delete TRACK.plan;          // لا هدف يومي: النسبة وحدها
  return TRACK;
}
const saveTrack = () => { try{ localStorage.setItem(TRACK_KEY, JSON.stringify(TRACK)); }catch(_){} };
const dayKey = d => new Date(d.getTime() - d.getTimezoneOffset()*60000).toISOString().slice(0,10);

function markRead(p){
  const i = p - 1;
  if(!TRACK || TRACK.read[i] === '1') return;
  TRACK.read = TRACK.read.slice(0, i) + '1' + TRACK.read.slice(i + 1);
  const k = dayKey(new Date());
  TRACK.days[k] = (TRACK.days[k] || 0) + 1;
  if(TRACK.read.indexOf('0') === -1){        // ختمة كاملة
    TRACK.khatmas++;
    TRACK.read = '0'.repeat(604);
  }
  sessionRead++;
  saveTrack();
  if(currentTab === 'paneTrack') renderTrack();
}

function readCount(){ return (TRACK.read.match(/1/g) || []).length; }
function streakDays(){
  const d = new Date(); let n = 0;
  if(!TRACK.days[dayKey(d)]) d.setDate(d.getDate() - 1);   // اليوم لم يبدأ بعد
  while(TRACK.days[dayKey(d)]){ n++; d.setDate(d.getDate() - 1); }
  return n;
}

function renderTrack(){
  const done = readCount(), pct = Math.round(done / 604 * 100);
  const todayN = TRACK.days[dayKey(new Date())] || 0;
  const C = 2 * Math.PI * 52;

  const notes = loadNotes(), nk = Object.keys(notes);
  const marks = loadMarks();
  const suraOf = k => SURAS[k.split(':')[0]] + ' · ' + arNum(k.split(':')[1]);
  const pageOfKey = k => {
    const v = verseOf(+k.split(':')[0], +k.split(':')[1]);
    return v ? v.page : 1;
  };
  const esc = t => t.replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));

  $('trackBody').innerHTML =
    '<div class="card">' +
      '<div class="prog">' +
        '<svg class="ring" viewBox="0 0 120 120">' +
          '<circle class="bg" cx="60" cy="60" r="52"/>' +
          // عند الصفر لا نرسم القوس: طرفه المستدير يترك نقطةً شاردة
          (pct > 0 ? '<circle class="fg" cx="60" cy="60" r="52" stroke-dasharray="' +
            (C * pct / 100).toFixed(1) + ' ' + C.toFixed(1) + '"/>' : '') + '</svg>' +
        '<div class="prog-num">' + arNum(pct) + '٪</div>' +
      '</div>' +
      '<div class="prog-sub">' + arNum(done) + ' من ' + arNum(604) + ' صفحة</div>' +
    '</div>' +

    '<div class="card"><h3>العلامات المرجعية</h3>' +
      (marks.length
        ? marks.map(p => '<div class="note"><div class="nh"><b>صفحة ' + arNum(p) + '</b>' +
            '<button data-goto="' + p + '" title="فتح">←</button>' +
            '<button data-unmark="' + p + '" title="حذف">×</button></div></div>').join('')
        : '<div class="hint" style="padding:8px 0">ضع علامةً من زرّ الشريط الأعلى</div>') +
    '</div>' +

    '<div class="card"><h3>حواشيك على الآيات</h3>' +
      (nk.length
        ? nk.map(k => '<div class="note"><div class="nh"><b>' + suraOf(k) + '</b>' +
            '<button data-goto="' + pageOfKey(k) + '" title="فتح">←</button>' +
            '<button data-delnote="' + k + '" title="حذف">×</button></div>' +
            '<p>' + esc(notes[k]) + '</p></div>').join('') +
          '<button class="ghost" id="expNotes">تصدير الحواشي ملفّاً</button>'
        : '<div class="hint" style="padding:8px 0">المس آيةً لتكتب حاشيتك عليها</div>') +
    '</div>' +

    '<div class="ver">مصحف شعبة · نسخة ' + CFG.VERSION + '</div>';

  $('trackBody').querySelectorAll('[data-goto]').forEach(b =>
    b.addEventListener('click', () => { switchTab('paneMushaf'); goto(+b.dataset.goto); }));
  $('trackBody').querySelectorAll('[data-unmark]').forEach(b =>
    b.addEventListener('click', () => {
      const m = loadMarks().filter(x => x !== +b.dataset.unmark);
      saveMarks(m); syncMark(current); renderTrack();
    }));
  $('trackBody').querySelectorAll('[data-delnote]').forEach(b =>
    b.addEventListener('click', () => {
      const n = loadNotes(); delete n[b.dataset.delnote]; saveNotes(n); renderTrack();
    }));
  const exp = $('expNotes');
  if(exp) exp.addEventListener('click', () => {
    const n = loadNotes();
    const txt = Object.keys(n).map(k => {
      const [su, ay] = k.split(':').map(Number);
      const v = verseOf(su, ay);
      return '﴿' + (v ? v.text : '') + '﴾\n[' + SURAS[su] + ': ' + ay + ' — صفحة ' +
             (v ? v.page : '') + ']\n\n' + n[k] + '\n\n────────────\n';
    }).join('\n');
    const a = document.createElement('a');
    // '\uFEFF' في أوّل الملف: بدونها تقرؤه عارضات أندرويد لاتينياً فيخرج طلاسم
    a.href = URL.createObjectURL(new Blob(['\uFEFF' + txt], { type:'text/plain;charset=utf-8' }));
    a.download = 'حواشي-مصحف-شعبة.txt';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  });

}

/* ══════════ الفهرس والبحث ══════════ */
// بدايات الأجزاء في مصحف المدينة. تحقّقت منها على بيانات شعبة نفسها:
// الجزء ٢ ← ٢:١٤٢ · الجزء ٣ ← ٢:٢٥٣ · الجزء ٣٠ ← ٧٨:١
const JUZ = [1,22,42,62,82,102,121,142,162,182,201,222,242,262,282,
             302,322,342,362,382,402,422,442,462,482,502,522,542,562,582];
let idxMode = 'suras';

function showJuzList(){
  const out = $('qOut');
  out.innerHTML = '';
  const frag = document.createDocumentFragment();
  JUZ.forEach((p, i) => {
    const ayat = PAGES.get(p) || [];
    const first = ayat[0];
    const b = document.createElement('button');
    b.className = 'row';
    b.innerHTML = '<span class="n">' + arNum(i + 1) + '</span><span class="t"><b>الجزء ' +
      arNum(i + 1) + '</b><span>صفحة ' + arNum(p) +
      (first ? ' · ' + SURAS[first.sura] + ' ' + arNum(first.aya) : '') + '</span></span>';
    b.addEventListener('click', () => { switchTab('paneMushaf'); goto(p); });
    frag.appendChild(b);
  });
  out.appendChild(frag);
}
$('segSuras').addEventListener('click', () => {
  idxMode = 'suras'; $('segSuras').classList.add('on'); $('segJuz').classList.remove('on');
  $('q').value = ''; showSuraList();
});
$('segJuz').addEventListener('click', () => {
  idxMode = 'juz'; $('segJuz').classList.add('on'); $('segSuras').classList.remove('on');
  $('q').value = ''; showJuzList();
});

function suraRow(id, sub){
  const b = document.createElement('button');
  b.className = 'row';
  b.innerHTML = '<span class="n">' + arNum(id) + '</span><span class="t"><b>سورة '
    + SURAS[id] + '</b><span>' + sub + '</span></span>';
  b.addEventListener('click', () => { switchTab('paneMushaf'); goto(SURA_PAGE[id]); });
  return b;
}

function showSuraList(){
  const out = $('qOut');
  out.innerHTML = '';
  const frag = document.createDocumentFragment();
  for(let i = 1; i <= 114; i++) frag.appendChild(suraRow(i, 'صفحة ' + arNum(SURA_PAGE[i])));
  out.appendChild(frag);
}

let qTimer = null;
$('q').addEventListener('input', () => {
  clearTimeout(qTimer);
  qTimer = setTimeout(runSearch, 180);
});

function runSearch(){
  const out = $('qOut');
  const raw = $('q').value.trim();
  if(!raw){ if(idxMode === 'juz') showJuzList(); else showSuraList(); return; }
  out.innerHTML = '';

  const digits = raw.replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d));
  if(/^\d+$/.test(digits)){
    const p = Math.max(1, Math.min(TOTAL, parseInt(digits)));
    const b = document.createElement('button');
    b.className = 'row';
    b.innerHTML = '<span class="n">·</span><span class="t"><b>صفحة ' + arNum(p) + '</b></span>';
    b.addEventListener('click', () => { switchTab('paneMushaf'); goto(p); });
    out.appendChild(b);
    return;
  }

  const q = norm(raw);
  const frag = document.createDocumentFragment();
  let n = 0;
  for(let i = 1; i <= 114 && n < 8; i++){
    if(norm(SURAS[i]).indexOf(q) !== -1){ frag.appendChild(suraRow(i, 'صفحة ' + arNum(SURA_PAGE[i]))); n++; }
  }

  buildSearchIndex();
  let hits = 0;
  for(let i = 0; i < VERSES.length && hits < 60; i++){
    const v = VERSES[i];
    if(v.n.indexOf(q) === -1) continue;
    hits++;
    const b = document.createElement('button');
    b.className = 'row';
    b.innerHTML = '<span class="n">' + arNum(v.aya) + '</span><span class="t"><b>'
      + SURAS[v.sura] + ' · صفحة ' + arNum(v.page) + '</b><i>'
      + (v.text.length > 95 ? v.text.slice(0, 95) + ' …' : v.text) + '</i></span>';
    b.addEventListener('click', () => { switchTab('paneMushaf'); goto(v.page); });
    frag.appendChild(b);
  }

  if(!n && !hits){ out.innerHTML = '<div class="hint">لا نتيجة</div>'; return; }
  out.appendChild(frag);
}

// دوران الشاشة أو تغيّر أبعادها: سعة السطر تتبع الارتفاع، فنعيد البناء
let refitTimer = null;
function refit(){
  if(CFG.LAYOUT === 'svg') return;   // الرسم المتجه يتمدّد بنفسه
  clearTimeout(refitTimer);
  refitTimer = setTimeout(() => {
    if(!current) return;
    curEm = null;
    buildPage(current);
    autofit();
  }, 160);
}
window.addEventListener('resize', refit);
window.addEventListener('orientationchange', refit);
if(window.visualViewport) window.visualViewport.addEventListener('resize', refit);

/* ══════════ البداية ══════════ */
// نُجبر تحميل خطوط الصفحة قبل أوّل قياس. document.fonts.ready وحده لا يكفي:
// إن لم يكن الخطّ قد بدأ التحميل يُحلّ فوراً، فيقاس عرض السطر بمقاييس خطّ
// بديل ويخرج الحجم خاطئاً في أوّل صفحة تُفتح.
async function preloadFonts(){
  if(!document.fonts || !document.fonts.load) return;
  const fam = getComputedStyle(pageEl).fontFamily.split(',')[0].trim().replace(/^["']|["']$/g,'');
  const jobs = [
    document.fonts.load('44px "' + fam + '"', 'بِسۡمِ ٱللَّهِ'),
    document.fonts.load('700 16px "IBM Plex Sans Arabic"', 'سورة ٠١٢')
  ];
  try{
    await Promise.race([
      Promise.allSettled(jobs),
      new Promise(r => setTimeout(r, 4000))   // صمّام أمان: لا ننتظر إلى الأبد
    ]);
  }catch(_){}
}

(async function start(){
  let saved = null;
  try{ saved = localStorage.getItem('shubah:theme'); }catch(_){}
  applyTheme(saved);
  loadTrack();
  if('serviceWorker' in navigator)
    navigator.serviceWorker.register('sw.js').catch(() => {});
  try{
    await loadQuran();
  }catch(_){
    msgEl.textContent = 'تعذّر فتح المصحف — تحقّق من الاتصال';
    return;
  }
  // ?page=٢٥٥ يفتح صفحة بعينها (للفحص والروابط)، وإلّا فآخر صفحة محفوظة
  let p = parseInt(new URLSearchParams(location.search).get('page')) || 0;
  if(!p){ try{ p = parseInt(localStorage.getItem(CFG.STORE_KEY)) || 1; }catch(_){ p = 1; } }
  if(CFG.LAYOUT !== 'svg') await preloadFonts();
  msgEl.classList.remove('show');
  render(Math.max(1, Math.min(TOTAL, p)));
})();
</script>
