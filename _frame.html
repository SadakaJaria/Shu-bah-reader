<!DOCTYPE html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#333;display:flex;justify-content:center}
iframe{width:390px;height:844px;border:0;background:#fff}
</style></head><body>
<iframe id="f" src="index.html?page=3"></iframe>
<script>
setTimeout(()=>{

},2500);
</script></body></html>
